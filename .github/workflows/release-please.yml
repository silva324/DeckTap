name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Generate Pre-release'
        type: boolean
        default: false
      prerelease_type:
        description: 'Pre-release type (alpha, beta, rc)'
        type: choice
        options:
          - none
          - rc
          - beta
          - alpha
        default: none

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  release-please:
    name: Release Please (Automated Versioning)
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Run Release Please Action
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          prerelease: ${{ inputs.prerelease || false }}
          prerelease-type: ${{ inputs.prerelease_type != 'none' && inputs.prerelease_type || '' }}

  publish-assets:
    name: Build & Publish Release Packages
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      prerelease: ${{ needs.release-please.outputs.prerelease == 'true' }}
    secrets: inherit
