name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'internal/webui/static/**'
      - '.github/workflows/deploy-pages.yml'
  release:
    types: [published, created]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp Release Version
        run: |
          VER=$(jq -r '."."' .release-please-manifest.json 2>/dev/null || echo "")
          if [ -n "$VER" ] && [ "$VER" != "null" ]; then
            echo "Stamping WebUI with version v$VER..."
            sed -i "s/const APP_VERSION = \".*\";/const APP_VERSION = \"$VER\";/" internal/webui/static/app.js
            sed -i "s/DeckTap v[0-9]*\.[0-9]*\.[0-9]*/DeckTap v$VER/g" internal/webui/static/index.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'internal/webui/static'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
