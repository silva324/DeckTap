<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" stroke="#1e293b" stroke-width="4"/>

  <!-- Background Layered Slide (Cyan Tint) -->
  <rect x="156" y="140" width="200" height="140" rx="16" fill="#38bdf8" opacity="0.2" transform="rotate(-8 256 210)"/>

  <!-- Main Slide Card -->
  <rect x="136" y="150" width="240" height="160" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="4" filter="url(#glow)"/>

  <!-- Slide Title Bar Line -->
  <rect x="164" y="182" width="110" height="14" rx="7" fill="#f8fafc"/>
  <!-- Slide Body Content Lines -->
  <rect x="164" y="214" width="184" height="10" rx="5" fill="#64748b"/>
  <rect x="164" y="238" width="130" height="10" rx="5" fill="#64748b"/>

  <!-- Secure E2EE Check Badge (Top Right) -->
  <circle cx="376" cy="136" r="28" fill="#090d16" stroke="#10b981" stroke-width="4"/>
  <path d="M 368 136 L 373 141 L 385 129" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dynamic Swipe Arc / Gesture Indicator (Emerald) -->
  <path d="M 110 360 C 180 420, 332 420, 402 360" fill="none" stroke="url(#emerald)" stroke-width="12" stroke-linecap="round"/>
  <!-- Swipe Arrow Head -->
  <path d="M 374 340 L 404 360 L 380 384" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
